name: Backend CI/CD (GHCR → GCP VM)

on:
  push:
    branches: [ "backend" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TAG: sha-${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. 소스 체크아웃
      - name: Checkout source
        uses: actions/checkout@v4

      # ✅ 2. Buildx 세팅 (캐시, 멀티아키텍처 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare lowercase owner and image
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER_LC/paybackfinder-backend" >> "$GITHUB_OUTPUT"

      # ✅ 3. GHCR 로그인
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      # ✅ 4. Docker 이미지 빌드 & 푸시 (Dockerfile이 루트에 있을 경우)
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .                      # 루트에 Dockerfile 존재
          push: true
          tags: |
            ${{ steps.prep.outputs.image }}:latest
            ${{ steps.prep.outputs.image }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # ✅ 1. GCP VM으로 SSH 접속
      - name: Deploy Backend to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd /home/User/paybackfinder
            
            git config --global --add safe.directory /home/User/paybackfinder
            
            echo "[+] Pulling latest source code from Git..."
            git pull origin backend
            
            echo "[+] Creating .env file on the server..."
            sudo bash -c '
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
              echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
              echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            '

            echo "[+] Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            echo "[+] Pulling latest backend image..."
            docker compose pull backend

            echo "[+] Restarting backend container..."
            docker compose up -d backend

            echo "[+] Cleaning up old images..."
            docker image prune -f --filter "until=72h"

            echo "[✅] Backend deployment completed successfully."
